# scripts.conf — repo-specifieke instellingen voor alles in bin/. Alleen bash-variabelen,
# geen logica: bin/_common.sh leest dit bestand met `source`. De map bin/ zelf is in
# alle HKweb-Joomla-repo's byte-identiek; wat per repo verschilt staat hier.
#
# Verplicht: PROJECT_NAME, PACKAGE_ELEMENT, ENV_PREFIX, GITHUB_REPO. De rest is optioneel
# (lege lijst of leeg = die controle of stap wordt overgeslagen).

# ─── Identiteit ──────────────────────────────────────────────────────────────
# Stam van de Joomla-elementen (plg_system_agentready, pkg_agentready).
PROJECT_NAME="agentready"
# Element van het installeerbare package (bestandsnaam van de zip: pkg_agentready-{versie}.zip).
PACKAGE_ELEMENT="pkg_agentready"
# Voorvoegsel voor omgevingsvariabelen: AGENTREADY_JOOMLA_DIR, AGENTREADY_NO_DDEV.
ENV_PREFIX="AGENTREADY"
# owner/repo op GitHub (release-polling, act-event, infourl in updates.xml).
GITHUB_REPO="hans2103/plg_system_agentready"

# ─── Structuur ───────────────────────────────────────────────────────────────
# Default Joomla-installatie voor setup-dev-links.sh en deploy-ddev.sh, als noch de
# omgevingsvariabele noch .dev-local een pad geeft.
JOOMLA_DIR_DEFAULT="$HOME/Development/Sites/momentsuntil/public_html"
# Geen component: package.sh schrijft geen sql/updates en run-release.sh commit die map niet.
COMPONENT_DIR=""
# Update-server-bestand waaraan add-update-entry.php de release toevoegt.
UPDATES_XML="updates.xml"
# Beschrijving van de release-procedure, genoemd in foutmeldingen.
RELEASE_DOC="docs/Release en deployment procedure.md"

# ─── Live-database (pull-live-db.sh) ─────────────────────────────────────────
# Leeg: deze repo is een herbruikbare extensie zonder eigen live-site.
LIVE_SSH_HOST=""
LIVE_JOOMLA_DIR=""

# ─── Manifests ───────────────────────────────────────────────────────────────
# Manifests waarvan <version> gelijk moet zijn aan die in package.xml (package.sh stempelt ze).
VERSIONED_MANIFESTS=(
"Src/plugins/system/agentready/agentready.xml"
)
# JSON-bestanden met een "version"-sleutel die ook gelijk moet zijn. Geen.
VERSIONED_JSON=()
# Alle extensie-manifests: hun <files>/<media>-secties moeten overeenkomen met de schijf.
EXTENSION_MANIFESTS=(
"Src/plugins/system/agentready/agentready.xml"
)

# ─── Dev-links (setup-dev-links.sh, deploy-ddev.sh) ──────────────────────────
# doel-in-Joomla|bron-in-repo
DEV_LINKS=(
"plugins/system/agentready|Src/plugins/system/agentready"
)
STALE_LINKS=()

# ─── Preflight ───────────────────────────────────────────────────────────────
# Paden (prefix) die de hygiënecontroles (debug, home-paden, geheimen, conflictmarkers)
# overslaan: bestanden waarin zulke tekst legitiem voorkomt. vendor/ is gebundelde code van derden.
SCAN_EXCLUDE=("docs/superpowers/" "Src/plugins/system/agentready/vendor/")
# Paden (prefix) die controle 15 (PHP-bestand zonder declare(strict_types=1)) daarnaast overslaat.
STRICT_TYPES_EXCLUDE=("Src/plugins/system/agentready/vendor/")
# AIdocs-werkwijze: structure = controle 14 (bin/check-aidocs.php).
AIDOCS_FLAVOUR="structure"
# Zwaarte van controle 7 (lengtegrenzen van CLAUDE.md en AIdocs-pagina's: 200 regels).
LENGTH_LIMIT_SEVERITY="ERROR"

# ─── updates.xml (add-update-entry.php) ──────────────────────────────────────
UPDATE_NAME="Agent Ready"
UPDATE_DESCRIPTION="System plugin that makes a Joomla site agent-ready: Markdown for Accept: text/markdown and Link headers for agent discovery"
# Joomla 5.3.3 en hoger binnen 5.x, en 6.x (Joomla matcht met /^…/ op JVERSION). Houd gelijk aan
# minimumJoomla/minimumPhp in package_script.php.
UPDATE_TARGETPLATFORM='(5\.(3\.([3-9]|[1-9][0-9])|[4-9]|[1-9][0-9])|6\.[0-9])'
UPDATE_PHP_MINIMUM="8.3.0"
UPDATE_MAINTAINER="HKweb"
UPDATE_MAINTAINER_URL="https://hkweb.nl"
# Waar de pakket-zip staat (zonder slash aan het eind). Leeg: de GitHub Release van de tag
# (https://github.com/{GITHUB_REPO}/releases/download/v{versie}/{PACKAGE_ELEMENT}-{versie}.zip).
UPDATE_DOWNLOAD_BASE=""
