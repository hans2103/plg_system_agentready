name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # bijv. v26.38.6

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify version matches package.xml
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_VERSION=$(grep -m1 '<version>' package.xml | sed -E 's#.*<version>([^<]+)</version>.*#\1#')
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag-versie ($VERSION) komt niet overeen met package.xml ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install zip en git-cliff
        run: |
          sudo apt-get update
          sudo apt-get install -y zip python3-pip
          pip install git-cliff --break-system-packages
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          git-cliff --version

      - name: Build package
        run: |
          chmod +x package.sh
          ./package.sh "${{ steps.get_version.outputs.version }}"

      - name: Genereer release notes met git-cliff
        run: |
          git-cliff --latest --strip header --output release_notes.md
          echo "Release notes:"
          cat release_notes.md

      # De stappen hieronder hebben effect buiten de runner. Ze worden overgeslagen als LOCAL_ACT is
      # gezet (bin/run-act.sh). Guard op LOCAL_ACT, nooit op ACT: `act` zet zelf ACT=true.
      - name: Create GitHub Release
        if: ${{ !env.LOCAL_ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_FILE="packages/${VERSION}/pkg_agentready-${VERSION}.zip"
          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "Error: pakket niet gevonden: $PACKAGE_FILE"
            exit 1
          fi
          gh release create "v${VERSION}" "$PACKAGE_FILE" \
            --title "Release v${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag

      - name: Update updates.xml
        if: ${{ !env.LOCAL_ACT }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # De checksum (sha512) is van precies de zip die naar de GitHub Release en de update-server gaat (issue #257).
          php bin/add-update-entry.php "$VERSION" --zip="packages/${VERSION}/pkg_agentready-${VERSION}.zip"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          if git diff --staged --quiet; then
            echo "updates.xml is al bijgewerkt voor v${VERSION}"
            exit 0
          fi
          git commit -m "chore(release): updates.xml uitgebreid met v${VERSION}"

          # package.sh heeft datum en versie in gevolgde bestanden gestempeld; niet committen en
          # niet in de weg laten staan voor de rebase hieronder.
          git checkout -- .

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "updates.xml bijgewerkt en gepusht naar main"
              exit 0
            fi
            echo "Push afgewezen (main is intussen verder), rebasen en opnieuw proberen (poging $i)..."
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "Error: kon updates.xml niet naar main pushen na 5 pogingen"
          exit 1

      # Zet de zip en updates.xml op de update server (https://updates.hkweb.nl/agentready/, web03),
      # zodat Joomla's updatebeheer de update kan vinden en, met een download-sleutel, ophalen. De
      # sleutel mag daar alleen schrijven in de eigen webroot (rrsync -wo). updates.hkweb.nl staat achter
      # de Cloudflare-proxy, die geen SSH doorlaat: UPDATES_SSH_HOST is daarom het origin-IP van web03.
      # Ontbreekt de secret of de variabele, dan slaat deze stap zichzelf over; de release is er dan al.
      - name: Publiceer op updates.hkweb.nl
        if: ${{ !env.LOCAL_ACT }}
        env:
          SSH_KEY: ${{ secrets.UPDATES_SSH_KEY }}
          SSH_HOST: ${{ vars.UPDATES_SSH_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::warning::UPDATES_SSH_KEY of UPDATES_SSH_HOST ontbreekt: niet gepubliceerd op updates.hkweb.nl"
            exit 0
          fi

          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_FILE="packages/${VERSION}/pkg_agentready-${VERSION}.zip"
          if [ ! -f "$PACKAGE_FILE" ] || [ ! -f updates.xml ]; then
            echo "Error: $PACKAGE_FILE of updates.xml ontbreekt"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          ( umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/updates )
          # Host key van web03 vastgezet: een andere server op dit adres wordt geweigerd.
          echo "${SSH_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG4eCFR8IgAXwSJoWXMY8V1jclgrjraWI0RkP50/G9Do" > ~/.ssh/known_hosts_updates
          SSH="ssh -i $HOME/.ssh/updates -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_updates -o StrictHostKeyChecking=yes"

          # Eerst de zip, dan updates.xml: updates.xml wijst zo nooit naar een zip die er nog niet staat.
          # Doelpad is './', niet 'agentready/': de deploy-sleutel is met rrsync beperkt tot de map
          # van deze extensie, en rrsync chdirt daarheen. Met 'agentready/' zou het in
          # .../agentready/agentready/ belanden.
          rsync -rtp --chmod=D755,F644 -e "$SSH" "$PACKAGE_FILE" "updates-hkweb@${SSH_HOST}:./"
          rsync -rtp --chmod=D755,F644 -e "$SSH" updates.xml "updates-hkweb@${SSH_HOST}:./updates.xml"
          rm -f ~/.ssh/updates

          echo "Gepubliceerd: https://updates.hkweb.nl/agentready/updates.xml en pkg_agentready-${VERSION}.zip"
