name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Check PHP syntax
        run: |
          find Src package_script.php bin tests -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null
          echo "✅ Alle PHP-bestanden hebben geldige syntax"

      - name: Verify version format
        run: |
          VERSION=$(grep -m1 '<version>' package.xml | sed -E 's#.*<version>([^<]+)</version>.*#\1#')
          echo "package.xml versie: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Error: ongeldig versieformaat (verwacht YY.WW.PATCH, bv. 26.45.0)"
            exit 1
          fi
          echo "✅ Versieformaat is geldig"

      - name: Check required files exist
        run: |
          REQUIRED_FILES=(
            "package.xml"
            "package_script.php"
            "package.sh"
            ".deployignore"
            "cliff.toml"
            "scripts.conf"
            "CLAUDE.md"
            "AIdocs/_index.md"
            "updates.xml"
            "README.md"
            "LICENSE.txt"
            "Src/plugins/system/agentready/agentready.xml"
            "Src/plugins/system/agentready/services/provider.php"
            "Src/plugins/system/agentready/vendor/autoload.php"
            "Src/plugins/system/agentready/vendor/league/html-to-markdown/LICENSE"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Error: verplicht bestand ontbreekt: $file"
              exit 1
            fi
          done
          echo "✅ Alle verplichte bestanden aanwezig"

      - name: Install xmllint, rsync and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils rsync zip unzip

      # Plain-PHP unit tests (no PHPUnit): each script exits non-zero on failure. Only the
      # output of a failing test is shown.
      - name: Unit tests
        run: |
          failed=0
          for f in tests/unit/*.php; do
            if ! php "$f" > "$RUNNER_TEMP/unit.log" 2>&1; then
              echo "::error file=$f::unit test failed"
              grep -v '^  ok' "$RUNNER_TEMP/unit.log"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "✅ Alle unit-tests geslaagd"
          exit "$failed"

      # Tests for bin/ (temporary repos, no network).
      - name: Shell tests
        run: bash tests/shell/run-all.sh

      - name: Validate XML files
        run: |
          xmllint --noout package.xml updates.xml Src/plugins/system/agentready/agentready.xml
          echo "✅ Alle XML-bestanden zijn geldig"

      - name: Check manifests against disk
        run: bash bin/preflight.sh --only 3,4

      - name: Check length limits (CLAUDE.md and AIdocs)
        run: bash bin/preflight.sh --only 7,14

      - name: Bundled vendor matches composer.lock
        working-directory: Src/plugins/system/agentready
        run: |
          composer validate --no-check-publish --no-check-all
          composer install --no-dev --dry-run 2>&1 | grep -q "Nothing to install, update or remove" \
            || { echo "::error::vendor/ wijkt af van composer.lock: draai composer install en commit vendor/"; exit 1; }
          echo "✅ vendor/ is actueel"

      - name: Test build script
        run: |
          chmod +x package.sh
          ./package.sh
          VERSION=$(grep -m1 '<version>' package.xml | sed -E 's#.*<version>([^<]+)</version>.*#\1#')
          PACKAGE_FILE="packages/${VERSION}/pkg_agentready-${VERSION}.zip"
          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "Error: package.sh heeft geen pakket gemaakt: $PACKAGE_FILE"
            exit 1
          fi
          echo "Pakket: $PACKAGE_FILE ($(du -h "$PACKAGE_FILE" | cut -f1))"

      - name: Verify package contents
        run: |
          VERSION=$(grep -m1 '<version>' package.xml | sed -E 's#.*<version>([^<]+)</version>.*#\1#')
          mkdir -p "$RUNNER_TEMP/pkgcheck"
          cd "$RUNNER_TEMP/pkgcheck"
          unzip -q "$GITHUB_WORKSPACE/packages/${VERSION}/pkg_agentready-${VERSION}.zip"
          for entry in pkg_agentready.xml package_script.php plg_system_agentready.zip language/en-GB/pkg_agentready.sys.ini language/nl-NL/pkg_agentready.sys.ini; do
            if [ ! -f "$entry" ]; then
              echo "Error: ontbreekt in het pakket: $entry"
              exit 1
            fi
          done
          unzip -Z1 plg_system_agentready.zip > plugin.list
          for path in agentready.xml services/provider.php src/Extension/AgentReady.php vendor/autoload.php vendor/league/html-to-markdown/src/HtmlConverter.php vendor/league/html-to-markdown/LICENSE language/en-GB/plg_system_agentready.ini language/nl-NL/plg_system_agentready.ini; do
            if ! grep -qx "${path}" plugin.list; then
              echo "Error: plugin-zip mist: $path"
              exit 1
            fi
          done
          if grep -qE '(^|/)CLAUDE\.md$|^vendor/bin/' plugin.list; then
            echo "Error: ontwikkelbestanden in de plugin-zip"
            exit 1
          fi
          echo "✅ Pakketinhoud is in orde"
