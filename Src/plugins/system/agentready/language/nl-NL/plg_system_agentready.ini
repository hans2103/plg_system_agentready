PLG_SYSTEM_AGENTREADY="Systeem - Agent Ready"
PLG_SYSTEM_AGENTREADY_XML_DESCRIPTION="Maakt de site leesbaar voor AI-agents: een Markdown-versie van elke pagina bij <code>Accept: text/markdown</code> (HTML blijft de standaard) en Link-headers naar llms.txt, de sitemap en meer."
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SELECTOR_LABEL="Hoofdcontent"
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SELECTOR_DESC="CSS-selectors voor het element met de hoofdcontent, gescheiden door komma's. De eerste die past wordt gebruikt. Ondersteund: tag, #id, .klasse, [attribuut] en [attribuut=waarde], gecombineerd met een spatie of &gt;."
PLG_SYSTEM_AGENTREADY_FIELD_REMOVE_SELECTORS_LABEL="Weglaten"
PLG_SYSTEM_AGENTREADY_FIELD_REMOVE_SELECTORS_DESC="CSS-selectors van elementen binnen de hoofdcontent die niet in de Markdown komen, gescheiden door komma's: scripts, menu's, formulieren, een cookiebanner. JSON-LD blijft altijd behouden en komt aan het eind."
PLG_SYSTEM_AGENTREADY_FIELD_FRONTMATTER_LABEL="Frontmatter"
PLG_SYSTEM_AGENTREADY_FIELD_FRONTMATTER_DESC="Begin de Markdown met een YAML-blok met de titel, omschrijving en afbeelding van de pagina."
PLG_SYSTEM_AGENTREADY_FIELD_JSONLD_LABEL="JSON-LD"
PLG_SYSTEM_AGENTREADY_FIELD_JSONLD_DESC="Zet de gestructureerde gegevens (JSON-LD) van de pagina aan het eind, in één json-codeblok."
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_LOGGED_IN_LABEL="Niet voor ingelogde gebruikers"
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_LOGGED_IN_DESC="Ingelogde gebruikers krijgen altijd HTML, zodat persoonlijke inhoud nooit in een Markdown-antwoord terechtkomt."
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_NOINDEX_LABEL="Niet voor noindex-pagina's"
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_NOINDEX_DESC="Pagina's met noindex in de robots-metatag of de X-Robots-Tag-header blijven HTML."
PLG_SYSTEM_AGENTREADY_FIELD_VARY_HTML_LABEL="Vary: Accept bij HTML"
PLG_SYSTEM_AGENTREADY_FIELD_VARY_HTML_DESC="Stuur ook bij HTML-pagina's Vary: Accept mee, zodat een proxy of CDN de HTML- en de Markdown-versie uit elkaar houdt."
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SIGNAL_LABEL="Content-Signal-header"
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SIGNAL_DESC="Optionele Content-Signal-header bij het Markdown-antwoord (zie contentsignals.org), bijvoorbeeld <code>search=yes, ai-input=yes, ai-train=no</code>. Een Content-Signal die de site al stuurt blijft staan. Leeg stuurt er geen."
PLG_SYSTEM_AGENTREADY_FIELDSET_MARKDOWN="Markdown"
PLG_SYSTEM_AGENTREADY_FIELDSET_LINKS="Link-headers"
PLG_SYSTEM_AGENTREADY_FIELDSET_ADVANCED="Geavanceerd"
PLG_SYSTEM_AGENTREADY_FIELD_MARKDOWN_LABEL="Markdown-versie"
PLG_SYSTEM_AGENTREADY_FIELD_MARKDOWN_DESC="Beantwoord verzoeken met <code>Accept: text/markdown</code> met een Markdown-versie van de pagina (Markdown for Agents)."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_HEADERS_LABEL="Link-headers"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_HEADERS_DESC="Stuur bij HTML-pagina's Link-headers (RFC 8288) mee die agents naar de bestanden hieronder wijzen. Links die andere plugins zetten blijven staan."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_LLMS_LABEL="llms.txt"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_LLMS_DESC="Link naar llms.txt (rel=describedby), alleen als dat bestand in de root van de site staat."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AGENT_SKILLS_LABEL="Agent-skills-index"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AGENT_SKILLS_DESC="Link naar .well-known/agent-skills/index.json (rel=describedby), alleen als dat bestand in de root van de site staat."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AI_CATALOG_LABEL="AI-catalogus (ARD)"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AI_CATALOG_DESC="Link naar .well-known/ai-catalog.json (rel=ai-catalog), het Agentic Resource Discovery-manifest: in de Link-header en als <code>&lt;link&gt;</code> in de HTML-head, alleen als dat bestand in de root van de site staat."
PLG_SYSTEM_AGENTREADY_FIELD_SITEMAP_URL_LABEL="Sitemap-URL"
PLG_SYSTEM_AGENTREADY_FIELD_SITEMAP_URL_DESC="URL van de XML-sitemap (rel=sitemap). Een relatieve URL geldt vanaf de root van de site. Leeg stuurt geen sitemap-link."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_MARKDOWN_LABEL="Markdown-versie"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_MARKDOWN_DESC="Link naar de Markdown-versie van de pagina zelf (rel=alternate, type=text/markdown)."
