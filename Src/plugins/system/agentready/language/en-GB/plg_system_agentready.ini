PLG_SYSTEM_AGENTREADY="System - Agent Ready"
PLG_SYSTEM_AGENTREADY_XML_DESCRIPTION="Makes the site readable for AI agents: a Markdown version of each page for <code>Accept: text/markdown</code> (HTML stays the default) and Link headers to llms.txt, the sitemap and more."
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SELECTOR_LABEL="Main content"
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SELECTOR_DESC="CSS selectors for the element that holds the main content, separated by commas. The first one that matches is used. Supported: tag, #id, .class, [attribute] and [attribute=value], combined with a space or &gt;."
PLG_SYSTEM_AGENTREADY_FIELD_REMOVE_SELECTORS_LABEL="Leave out"
PLG_SYSTEM_AGENTREADY_FIELD_REMOVE_SELECTORS_DESC="CSS selectors of elements inside the main content that stay out of the Markdown, separated by commas: scripts, menus, forms, a cookie banner. JSON-LD is always kept and added at the end."
PLG_SYSTEM_AGENTREADY_FIELD_FRONTMATTER_LABEL="Frontmatter"
PLG_SYSTEM_AGENTREADY_FIELD_FRONTMATTER_DESC="Start the Markdown with a YAML block holding the title, description and image of the page."
PLG_SYSTEM_AGENTREADY_FIELD_JSONLD_LABEL="JSON-LD"
PLG_SYSTEM_AGENTREADY_FIELD_JSONLD_DESC="Add the structured data (JSON-LD) of the page at the end, in one json code block."
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_LOGGED_IN_LABEL="Not for logged-in users"
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_LOGGED_IN_DESC="Logged-in users always get HTML, so personal content never ends up in a Markdown answer."
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_NOINDEX_LABEL="Not for noindex pages"
PLG_SYSTEM_AGENTREADY_FIELD_SKIP_NOINDEX_DESC="Pages with noindex in their robots meta tag or X-Robots-Tag header stay HTML."
PLG_SYSTEM_AGENTREADY_FIELD_VARY_HTML_LABEL="Vary: Accept on HTML"
PLG_SYSTEM_AGENTREADY_FIELD_VARY_HTML_DESC="Also send Vary: Accept with HTML pages, so a proxy or CDN keeps the HTML and the Markdown version apart."
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SIGNAL_LABEL="Content-Signal header"
PLG_SYSTEM_AGENTREADY_FIELD_CONTENT_SIGNAL_DESC="Optional Content-Signal header on the Markdown answer (see contentsignals.org). Empty sends none."
PLG_SYSTEM_AGENTREADY_FIELDSET_MARKDOWN="Markdown"
PLG_SYSTEM_AGENTREADY_FIELDSET_LINKS="Link headers"
PLG_SYSTEM_AGENTREADY_FIELDSET_ADVANCED="Advanced"
PLG_SYSTEM_AGENTREADY_FIELD_MARKDOWN_LABEL="Markdown version"
PLG_SYSTEM_AGENTREADY_FIELD_MARKDOWN_DESC="Answer requests with <code>Accept: text/markdown</code> with a Markdown version of the page (Markdown for Agents)."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_HEADERS_LABEL="Link headers"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_HEADERS_DESC="Send Link headers (RFC 8288) with HTML pages that point agents to the files below. Links other plugins set are kept."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_LLMS_LABEL="llms.txt"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_LLMS_DESC="Link to llms.txt (rel=describedby), only when that file exists in the site root."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AGENT_SKILLS_LABEL="Agent skills index"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_AGENT_SKILLS_DESC="Link to .well-known/agent-skills/index.json (rel=describedby), only when that file exists in the site root."
PLG_SYSTEM_AGENTREADY_FIELD_SITEMAP_URL_LABEL="Sitemap URL"
PLG_SYSTEM_AGENTREADY_FIELD_SITEMAP_URL_DESC="URL of the XML sitemap (rel=sitemap). A relative URL is taken from the site root. Empty sends no sitemap link."
PLG_SYSTEM_AGENTREADY_FIELD_LINK_MARKDOWN_LABEL="Markdown version"
PLG_SYSTEM_AGENTREADY_FIELD_LINK_MARKDOWN_DESC="Link to the Markdown version of the page itself (rel=alternate, type=text/markdown)."
